<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-K+spvCIh03d+kMqTCjrXKKaxTOjhKSV4BTx1QbtLmtU=' 'sha256-QJqEyoOWknw7jfAoSAJG6k/3oGXbBXMuvhfCG+SDF/o='; style-src 'unsafe-inline'; connect-src https://0.peerjs.com wss://0.peerjs.com; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>湖光戰記</title>
<style>
/* Layout: the lake canvas fills the screen; status and score sit on top,
   a floating joystick lives bottom-left, four action buttons fan out bottom-right. */
:root{
  --ink:#2a1608; --paper:#fff1d0; --sand:#ffc65a; --blue:#2d78c8; --red:#b3202a; --amber:#f6b93b;
  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{font-size:14px;background:var(--ink);color:var(--paper);font-family:var(--font-ui);overflow:hidden;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:relative;height:100%;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#ui{position:absolute;inset:0;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:12px}
#ui > *{pointer-events:auto}
#ui > #pad{pointer-events:none}

#hud{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.panel{background:rgba(42,22,8,.78);border:2px solid rgba(255,241,208,.18);border-radius:10px;padding:8px 10px}
#left{display:flex;flex-direction:column;gap:6px;min-width:0;max-width:62%}
#status{font-size:12px;font-weight:700;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--amber);margin-right:6px}
#status.live::before{background:#7be07b}
#hpwrap{display:flex;align-items:center;gap:8px}
#hpbar{flex:1;min-width:110px;height:12px;border-radius:6px;background:rgba(255,241,208,.16);overflow:hidden}
#hpfill{height:100%;width:100%;background:var(--blue);border-radius:6px;transition:width .12s}
#hpnum{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;min-width:3ch;text-align:right}
#invite{pointer-events:auto;font:700 12px var(--font-ui);padding:6px 10px;border-radius:8px;border:2px solid var(--ink);background:var(--amber);color:var(--ink);cursor:pointer}
#score{display:flex;flex-direction:column;gap:3px;font-size:13px;font-weight:700;min-width:96px}
#score .row{display:flex;align-items:center;gap:6px}
#score .dot{width:10px;height:10px;border-radius:50%;flex:none}
#score .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:9em}
#score .k{font-variant-numeric:tabular-nums}
#score .goal{font-size:11px;font-weight:500;opacity:.7}
#banner{position:absolute;left:50%;top:17%;transform:translateX(-50%);max-width:calc(100% - 32px);text-align:center;
  font-weight:900;font-size:clamp(20px,5vw,34px);padding:10px 20px;background:rgba(42,22,8,.85);
  border:2px solid var(--amber);border-radius:12px;pointer-events:none;text-wrap:balance}

#stickZone{position:absolute;left:0;bottom:0;width:50%;height:62%}
#stick{position:absolute;width:128px;height:128px;border-radius:50%;margin:-64px 0 0 -64px;
  background:rgba(42,22,8,.45);border:3px solid rgba(255,241,208,.4);pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;
  background:var(--paper);opacity:.9;box-shadow:0 3px 0 rgba(0,0,0,.35)}

#pad{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:216px;height:216px;pointer-events:none}
.act{pointer-events:auto;position:absolute;border-radius:50%;border:3px solid var(--ink);color:var(--ink);font-family:var(--font-ui);
  font-weight:900;font-size:14px;line-height:1.1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 5px 0 rgba(0,0,0,.4);cursor:pointer;touch-action:none;padding:0;overflow:hidden;--cd:0}
.act::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(rgba(42,22,8,.72) calc(var(--cd)*360deg),transparent 0);pointer-events:none}
.act.on{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.act:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
.act kbd{font-family:inherit;font-size:11px;font-weight:700;opacity:.65}
#bAtk{right:0;bottom:0;width:104px;height:104px;font-size:20px;background:var(--amber)}
#bSkill{right:116px;bottom:6px;width:72px;height:72px;background:var(--paper)}
#bDash{right:92px;bottom:92px;width:72px;height:72px;background:#8fd0ee}
#bUlt{right:8px;bottom:116px;width:72px;height:72px;background:#e9a6ff}
#bUlt.ready{box-shadow:0 5px 0 rgba(0,0,0,.4),0 0 0 4px #fff,0 0 22px 8px #e9a6ff}
@media (hover:none){.act kbd{display:none}}

#start{position:absolute;inset:0;display:flex;background:rgba(42,22,8,.62);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));overflow:auto}
#card{margin:auto;width:min(440px,100%);background:var(--ink);border:3px solid var(--sand);border-radius:16px;padding:20px 18px;
  display:flex;flex-direction:column;gap:13px;-webkit-user-select:text;user-select:text}
#card h1{margin:0;font-size:36px;font-weight:900;letter-spacing:.08em;color:var(--sand);line-height:1.1}
#card .sub{margin:0;font-size:14px;font-weight:500;opacity:.85;line-height:1.6}
#card label,.lab{font-size:12px;font-weight:700;letter-spacing:.08em;opacity:.8}
#classes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cls{min-width:0;display:flex;flex-direction:column;gap:3px;align-items:center;padding:10px 4px;border-radius:12px;
  border:2px solid rgba(255,241,208,.3);background:rgba(255,241,208,.06);color:var(--paper);font-family:var(--font-ui);cursor:pointer}
.cls b{font-size:18px;font-weight:900}
.cls span{font-size:11px;line-height:1.4;opacity:.85;text-align:center}
.cls[aria-pressed="true"]{border-color:var(--amber);background:rgba(246,185,59,.2)}
.cls:focus-visible{outline:3px solid var(--paper);outline-offset:2px}
#clsInfo{font-size:12.5px;line-height:1.6;opacity:.9;margin:0}
#nameIn{width:100%;font:700 18px var(--font-ui);padding:10px 12px;border-radius:10px;border:2px solid rgba(255,241,208,.35);
  background:rgba(255,241,208,.08);color:var(--paper)}
#nameIn:focus-visible,#codeIn:focus-visible{outline:3px solid var(--amber);outline-offset:1px}
#go{font:900 20px var(--font-ui);letter-spacing:.1em;padding:13px;border-radius:12px;border:3px solid var(--ink);
  background:var(--amber);color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.5);cursor:pointer}
#go:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.5)}
.or{display:flex;align-items:center;gap:10px;font-size:12px;opacity:.7}
.or::before,.or::after{content:"";flex:1;height:1px;background:rgba(255,241,208,.3)}
#joinRow{display:flex;gap:8px}
#codeIn{flex:1;min-width:0;font:700 20px var(--font-ui);letter-spacing:.2em;text-align:center;padding:10px 8px;border-radius:10px;
  border:2px solid rgba(255,241,208,.35);background:rgba(255,241,208,.08);color:var(--paper)}
#codeIn::placeholder{font:500 13px var(--font-ui);letter-spacing:0}
#joinBtn{font:900 17px var(--font-ui);padding:10px 20px;border-radius:10px;border:3px solid var(--ink);background:var(--paper);color:var(--ink);
  box-shadow:0 4px 0 rgba(0,0,0,.5);cursor:pointer}
#go:focus-visible,#joinBtn:focus-visible,#solo:focus-visible,#invite:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
#solo{font:700 14px var(--font-ui);padding:8px;background:none;border:none;color:var(--paper);text-decoration:underline;cursor:pointer;opacity:.85}
#lobby{font-size:13px;line-height:1.6;padding:10px 12px;border-radius:10px;background:rgba(255,241,208,.08)}
#safe{margin:0;font-size:11.5px;line-height:1.6;opacity:.7}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div id="ui">
    <div id="hud">
      <div id="left" class="panel">
        <div id="status">準備中</div>
        <div id="hpwrap"><div id="hpbar"><div id="hpfill"></div></div><div id="hpnum">100</div></div>
        <button id="invite" type="button" hidden>複製邀請連結</button>
      </div>
      <div id="score" class="panel"></div>
    </div>
    <div id="banner" hidden></div>
    <div id="stickZone"><div id="stick"><div id="knob"></div></div></div>
    <div id="pad">
      <button class="act" id="bUlt" type="button"><span id="lUlt">大招</span><kbd>I</kbd></button>
      <button class="act" id="bDash" type="button">衝刺<kbd>L</kbd></button>
      <button class="act" id="bSkill" type="button"><span id="lSkill">技能</span><kbd>K</kbd></button>
      <button class="act" id="bAtk" type="button"><span id="lAtk">攻擊</span><kbd>J</kbd></button>
    </div>
  </div>
  <div id="start">
    <form id="card">
      <h1>湖光戰記</h1>
      <p class="sub">雙人連線對戰。選一個職業，帶著靈獸上場，先擊倒對手 5 次獲勝。</p>
      <div>
        <div class="lab">選擇職業</div>
        <div id="classes"></div>
      </div>
      <p id="clsInfo"></p>
      <div>
        <label for="nameIn">你的代號</label>
        <input id="nameIn" maxlength="8" autocomplete="off" placeholder="最多 8 個字">
      </div>
      <button id="go" type="button">開房間</button>
      <div class="or">或是加入別人的房間</div>
      <div id="joinRow">
        <input id="codeIn" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="輸入 6 位數房號" aria-label="房號">
        <button id="joinBtn" type="submit">加入</button>
      </div>
      <div id="lobby">開房間後畫面左上會顯示房號，把房號告訴對方。對方輸入房號按「加入」就會連上。</div>
      <button id="solo" type="button">先跟電腦練習</button>
      <p id="safe">請只把房號給認識的人。連線是兩台裝置直接互連，對方的裝置在技術上看得到你的網路 IP 位址。遊戲不會收集或儲存任何個人資料，代號只存在你自己的裝置上。</p>
    </form>
  </div>
</div>

<script>
(() => {
'use strict';
const PEER_OPTS = {};
const W = 1400, H = 1000, R = 18, WIN = 5;
const CLS = [
  { name: '劍士', hp: 125, spd: 245, atkCd: 380, skCd: 5000, atk: '斬擊', sk: '旋風斬', ult: '劍氣波', sp: '焰狐', spc: '#ff8a3c',
    tag: '血厚・貼身爆發', info: '斬擊要貼近才打得到。旋風斬打身邊一圈，大招「劍氣波」會穿過木棧道。' },
  { name: '弓手', hp: 100, spd: 235, atkCd: 300, skCd: 5000, atk: '射箭', sk: '五連箭', ult: '箭雨', sp: '風隼', spc: '#7be0a0',
    tag: '射程遠・持續輸出', info: '按住連射。五連箭一次射出扇形五支箭，大招「箭雨」落在對手腳下。' },
  { name: '法師', hp: 90, spd: 225, atkCd: 430, skCd: 6000, atk: '魔彈', sk: '冰環', ult: '隕石', sp: '霜鹿', spc: '#8fd0ff',
    tag: '範圍傷害・能緩速', info: '魔彈較慢但判定大。冰環會讓身邊的對手變慢，大招「隕石」範圍最大、傷害最高。' },
];
/* projectile types: arrow, magic orb, sword wave, spirit bolt */
const PT = [
  { spd: 700, r: 6, dmg: 11, range: 760 },
  { spd: 480, r: 13, dmg: 15, range: 640 },
  { spd: 520, r: 42, dmg: 45, range: 720, pierce: 1 },
  { spd: 420, r: 7, dmg: 6, range: 520 },
];
/* instant area hits: slash, spin, frost ring, arrow rain, meteor */
const EV = [
  { r: 88, arc: 1.15, dmg: 16 },
  { r: 112, dmg: 30 },
  { r: 150, dmg: 22, slow: 2000 },
  { r: 130, dmg: 50 },
  { r: 150, dmg: 60 },
];
const TG = { 3: 0.8, 4: 1.0 };
const DASH_CD = 2200;
const WALLS = [
  [620, 430, 160, 140],
  [280, 230, 200, 44], [920, 726, 200, 44],
  [280, 600, 44, 200], [1076, 200, 44, 200],
  [560, 150, 44, 150], [796, 700, 44, 150],
  [180, 470, 120, 44], [1100, 486, 120, 44],
];
const SPAWNS = [[120,120],[1280,880],[1280,120],[120,880],[700,90],[700,910]];
const COL = { me: '#2d78c8', foe: '#b3202a' };
const FONT = getComputedStyle(document.documentElement).getPropertyValue('--font-ui') || 'sans-serif';
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const num = (v, d = 0) => (typeof v === 'number' && isFinite(v)) ? v : d;
const angDiff = (a, b) => { let d = (a - b) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return Math.abs(d); };

/* ---------- fighters ---------- */
function makeFighter(id, n) {
  return { id, n, c: 0, x: 120, y: 120, a: 0, hp: 100, dead: false, respawnAt: 0, inv: 0, slowUntil: 0, lastHurt: 0,
    dashUntil: 0, dx: 0, dy: 0, cd: { atk: 0, skill: 0, dash: 0, spirit: 0 }, ult: 0,
    b: [], bid: 0, tg: [], tid: 0, ev: [], evSeq: 0, hb: [0, '', 0, 0],
    e: [], eatSet: new Set(), k: 0, d: [0, ''], r: 0, seen: {}, spread: 0.05, speed: 1 };
}
let myName = '';
try { myName = localStorage.getItem('lb-name') || ''; } catch (_) {}
if (!myName) myName = '玩家' + (10 + Math.floor(Math.random() * 90));
const me = makeFighter('me', myName);
try { me.c = clamp(parseInt(localStorage.getItem('lb-class'), 10) || 0, 0, 2); } catch (_) {}
const bot = makeFighter('bot', '電腦兵');
bot.spread = 0.3; bot.speed = 0.8;
bot.ai = { side: 1, flipAt: 0, nextAtk: 0, checkAt: 0, lx: 0, ly: 0, unstickUntil: 0, ux: 0, uy: 0 };

function viewOf(f, now) {
  return { g: 2, n: f.n, c: f.c, x: Math.round(f.x), y: Math.round(f.y), a: +f.a.toFixed(2),
    hp: Math.max(0, Math.round(f.hp)), dd: f.dead ? 1 : 0, iv: f.inv > now ? 1 : 0, sl: f.slowUntil > now ? 1 : 0,
    b: f.b.map(b => [b.id, Math.round(b.x), Math.round(b.y), +b.ang.toFixed(2), b.t]),
    tg: f.tg.map(t => [t.id, t.x, t.y, +t.p.toFixed(2), t.kind]),
    ev: f.ev, e: f.e, k: f.k, d: f.d, hb: f.hb, r: f.r };
}
function localView(f, now) { const v = viewOf(f, now); v.id = f.id; v.t = now; v.local = true; return v; }

/* Everything a remote device sends is untrusted: every field is type-checked, clamped and length-capped here. */
function parseRemote(id, s, now) {
  if (!s || typeof s !== 'object' || s.g !== 2) return null;
  const arr = v => Array.isArray(v) ? v : [];
  const int = (v, max) => clamp(Math.floor(num(v)), 0, max);
  const c = int(s.c, 2);
  return {
    id, t: now, local: false, c,
    n: String(s.n == null ? '對手' : s.n).slice(0, 8) || '對手',

function drawSpirit(v, x, y, now) {

function drawBoat(v, x, y, color, isMe, now, flashAt) {
  if (v.dd) {

    for (let i = 1; i <= 3; i++) { ctx.beginPath(); ctx.arc(x, y, 8 * i + ((now / 60) % 8), 0, TAU); ctx.stroke(); }

  ctx.strokeStyle = v.sl ? '#bfe6ff' : color; ctx.globalAlpha = 0.6; ctx.lineWidth = v.sl ? 5 : 2.5;

  ctx.lineCap = 'round';
  if (v.c === 0) {
    ctx.strokeStyle = '#2a1608'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(6, 9); ctx.lineTo(38, 15); ctx.stroke();
    ctx.strokeStyle = '#f2f6ff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(12, 10); ctx.lineTo(38, 15); ctx.stroke();
  } else if (v.c === 1) {
    ctx.strokeStyle = '#2a1608'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(8, 0, 17, -1.15, 1.15); ctx.stroke();
    ctx.strokeStyle = '#fff1d0'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(8 + 17 * Math.cos(1.15), -17 * Math.sin(1.15)); ctx.lineTo(8 + 17 * Math.cos(1.15), 17 * Math.sin(1.15)); ctx.stroke();
  } else {
    ctx.strokeStyle = '#2a1608'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(0, 10); ctx.lineTo(28, 12); ctx.stroke();
    ctx.fillStyle = '#b9e4ff'; ctx.shadowColor = '#5ab8ff'; ctx.shadowBlur = 12; ctx.beginPath(); ctx.arc(31, 12, 6, 0, TAU); ctx.fill(); ctx.shadowBlur = 0;
  }

  ctx.fillStyle = color; ctx.beginPath(); ctx.arc(-2, 0, 11, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#2a1608'; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.fillStyle = 'rgba(20,8,0,.55)'; ctx.beginPath(); ctx.arc(-3, 0, 6, 0, TAU); ctx.fill();
  ctx.restore();
  if (now - flashAt < 110) { ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.beginPath(); ctx.arc(x, y, R + 4, 0, TAU); ctx.fill(); }
  ctx.globalAlpha = 1;
  drawSpirit(v, x, y, now);
  ctx.font = `700 13px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(42,22,8,.9)'; ctx.fillStyle = '#fff1d0';
  const label = (isMe ? v.n + '（你）' : v.n) + '・' + CLS[v.c].name;
  ctx.strokeText(label, x, y - 44); ctx.fillText(label, x, y - 44);
  ctx.fillStyle = 'rgba(42,22,8,.85)'; ctx.fillRect(x - 25, y - 39, 50, 7);
  ctx.fillStyle = color; ctx.fillRect(x - 24, y - 38, 48 * v.hp / CLS[v.c].hp, 5);
}
function drawBullet(b, c, ext) {
  const T = PT[b[4]], cs = Math.cos(b[3]), sn = Math.sin(b[3]), x = b[1] + cs * T.spd * ext, y = b[2] + sn * T.spd * ext;
  if (b[4] === 0) {
    ctx.strokeStyle = '#fff6d0'; ctx.lineWidth = 4; ctx.shadowColor = '#ff7a1a'; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.moveTo(x - cs * 22, y - sn * 22); ctx.lineTo(x, y); ctx.stroke();
  } else if (b[4] === 1) {
    ctx.fillStyle = '#e8f6ff'; ctx.shadowColor = '#3aa0ff'; ctx.shadowBlur = 22;
    ctx.beginPath(); ctx.arc(x, y, 11, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(90,170,255,.5)'; ctx.beginPath(); ctx.arc(x - cs * 12, y - sn * 12, 8, 0, TAU); ctx.fill();

const fx = {}, hits = [], pops = [], smooth = {};
function drawHit(h, now) {
  const dur = h.k === 0 ? 170 : 460, p = (now - h.t) / dur;
  if (p >= 1) return false;
  const K = EV[h.k], q = 1 - p;
  if (h.k === 0) {
    ctx.strokeStyle = `rgba(255,246,220,${0.95 * q})`; ctx.lineWidth = 12 * q + 3; ctx.lineCap = 'round';
    const a0 = h.a - K.arc + p * 0.8;

  }

function render(views, now, dt) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const s = clamp(Math.min(cw, ch) / 640, 0.5, 1.4);
  const vw = cw / s, vh = ch / s;
  let camx = clamp(me.x - vw / 2, -vw * 0.36, W - vw * 0.64);
  let camy = clamp(me.y - vh * 0.46, -vh * 0.3, H - vh * 0.62);
  if (shake > 0.3 && !reduceMotion) { camx += (Math.random() - 0.5) * shake; camy += (Math.random() - 0.5) * shake; }

  drawLake(now);

  for (const v of views) {
    let f = fx[v.id];
    if (!f) f = fx[v.id] = { ev: maxSeq(v), hb: v.hb[0], flash: 0 };
    for (const x of v.ev) if (x[0] > f.ev) {
      f.ev = x[0]; hits.push({ k: x[1], x: x[2], y: x[3], a: x[4], t: now });
      if (x[1] >= 3 && Math.hypot(x[2] - me.x, x[3] - me.y) < 360) shake = Math.max(shake, 7);
    }
    if (v.hb[0] !== f.hb) {
      f.hb = v.hb[0]; f.flash = now;
      pops.push({ x: v.x + (Math.random() - 0.5) * 24, y: v.y - 30, n: v.hb[2], crit: v.hb[3], mine: v.id === me.id, t: now });
    }
  }
  // warnings for incoming area attacks
  for (const v of views) for (const t of v.tg) {
    const r = t[4] === 3 ? EV[3].r : EV[4].r;
    ctx.fillStyle = `rgba(190,30,20,${0.12 + 0.2 * t[3]})`; ctx.beginPath(); ctx.arc(t[1], t[2], r, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(255,240,200,.9)'; ctx.lineWidth = 3; ctx.setLineDash([10, 8]); ctx.beginPath(); ctx.arc(t[1], t[2], r, 0, TAU); ctx.stroke(); ctx.setLineDash([]);

      ctx.fillStyle = '#ffe9b0'; ctx.shadowColor = '#ff5a00'; ctx.shadowBlur = 30; ctx.beginPath(); ctx.arc(mx, my, 20, 0, TAU); ctx.fill(); ctx.shadowBlur = 0;

/* ---------- HUD ---------- */
const statusEl = $('status'), hpfill = $('hpfill'), hpnum = $('hpnum'), scoreEl = $('score'), lobbyEl = $('lobby');
let hudAt = 0, scoreKey = '';
function hud(views, live, now) {
  $('bSkill').style.setProperty('--cd', clamp((me.cd.skill - now) / CLS[me.c].skCd, 0, 1).toFixed(3));
  $('bDash').style.setProperty('--cd', clamp((me.cd.dash - now) / DASH_CD, 0, 1).toFixed(3));
  $('bUlt').style.setProperty('--cd', (1 - me.ult / 100).toFixed(3));
  if (now - hudAt < 120) return;
  hudAt = now;
  $('bUlt').classList.toggle('ready', me.ult >= 100);
  hpfill.style.width = (100 * me.hp / CLS[me.c].hp) + '%'; hpnum.textContent = Math.round(me.hp);
  statusEl.classList.toggle('live', live);
  statusEl.textContent = live ? `連線對戰中・房號 ${net.code}` : net.role === 'h' ? `房號 ${net.code}・等待對手加入` : net.role === 'g' ? '連線中斷・跟電腦練習中' : '單人練習・對手是電腦';
  $('invite').hidden = !(entered && net.role === 'h' && !live);
  const key = views.map(v => v.id + v.n + v.k + v.color).join('|');
  if (key !== scoreKey) {
    scoreKey = key; scoreEl.textContent = '';
    for (const v of views) {
      const row = document.createElement('div'); row.className = 'row';
      const dot = document.createElement('span'); dot.className = 'dot'; dot.style.background = v.color || COL.me;
      const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = v.n;
      const k = document.createElement('span'); k.className = 'k'; k.textContent = v.k;
      row.append(dot, nm, k); scoreEl.append(row);
    }
    const goal = document.createElement('div'); goal.className = 'goal'; goal.textContent = `先到 ${WIN} 次擊倒獲勝`;
    scoreEl.append(goal);
  }
  let text = '';
  if (now < interUntil) text = interText;
  else if (entered && me.dead) text = `你被擊倒了・${Math.max(1, Math.ceil((me.respawnAt - now) / 1000))} 秒後重返戰場`;
  else if (now < toastUntil) text = toastText;
  banner.hidden = !text; if (text) banner.textContent = text;
}

/* ---------- main loop ---------- */
let last = performance.now(), botOn = false;
function frame() {
  const now = performance.now(), dt = Math.min(0.05, (now - last) / 1000); last = now;
  const remotes = [];
  if (net.conn && net.remote && now - net.remoteAt < 4000) remotes.push(net.remote);
  const wantBot = entered && remotes.length === 0;
  if (wantBot && !botOn) { bot.c = Math.floor(Math.random() * 3); bot.k = 0; bot.b = []; bot.tg = []; bot.ult = 0; respawn(bot, [me], now); }
  botOn = wantBot;
  const frozen = now < interUntil;

  if (entered) {
    const meV0 = localView(me, now), botV0 = botOn ? localView(bot, now) : null;
    const foes = botOn ? [botV0] : remotes;
    step(me, readInput(), foes, dt, now, frozen);
    incoming(me, foes, now, frozen);
    if (botOn) { step(bot, botInput(now, meV0, frozen), [meV0], dt, now, frozen); incoming(bot, [meV0], now, frozen); }
    if (net.conn && net.conn.open && now - lastSend > 50) { lastSend = now; try { net.conn.send({ q: ++net.q, s: viewOf(me, now) }); } catch (_) {} }
  }
  const views = [localView(me, now)];
  if (botOn) views.push(localView(bot, now)); else for (const v of remotes) views.push(v);

  if (entered) {
    for (const v of views) {
      const key = v.id + ':' + v.r;
      if (v.k >= WIN && !handledWins.has(key)) {
        handledWins.add(key);
        interText = (v.id === me.id ? '你' : v.n) + ' 獲勝！下一回合即將開始';
        interUntil = now + 5000; pendingReset = v.id;
      }
    }
    if (pendingReset && now >= interUntil) {
      const foes = views.filter(v => v.id !== me.id);
      if (pendingReset === me.id) me.r++;
      me.k = 0; me.b = []; me.tg = []; respawn(me, foes, now);
      if (botOn) { if (pendingReset === bot.id) bot.r++; bot.k = 0; bot.b = []; bot.tg = []; respawn(bot, [me], now); }
      pendingReset = null;
    }
  }
  render(views, now, dt);
  hud(views, remotes.length > 0, now);
  requestAnimationFrame(frame);
}

/* ---------- start screen ---------- */
function pickClass(i) {
  me.c = i; me.hp = CLS[i].hp;
  document.querySelectorAll('.cls').forEach((el, j) => el.setAttribute('aria-pressed', String(j === i)));
  $('clsInfo').textContent = `${CLS[i].info} 靈獸「${CLS[i].sp}」會跟著你自動攻擊。`;
  $('lAtk').textContent = CLS[i].atk; $('lSkill').textContent = CLS[i].sk; $('lUlt').textContent = CLS[i].ult;
}
CLS.forEach((C, i) => {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'cls';
  const n = document.createElement('b'); n.textContent = C.name;
  const t = document.createElement('span'); t.textContent = C.tag;
  b.append(n, t); b.addEventListener('click', () => pickClass(i)); $('classes').append(b);
});
pickClass(me.c);
function enter() {
  const n = $('nameIn').value.trim().slice(0, 8);
  if (n) me.n = n;
  try { localStorage.setItem('lb-name', me.n); localStorage.setItem('lb-class', String(me.c)); } catch (_) {}
  $('start').hidden = true; entered = true; net.state = 'in';
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {}); } catch (_) {}

$('nameIn').value = myName;
$('go').addEventListener('click', host);
$('solo').addEventListener('click', () => { if (net.state === 'idle') enter(); });
$('card').addEventListener('submit', e => { e.preventDefault(); join($('codeIn').value.trim()); });
const invited = new URLSearchParams(location.search).get('room');
if (invited && /^\d{6}$/.test(invited)) { $('codeIn').value = invited; netStatus('已帶入房號 ' + invited + '，選好職業和代號後按「加入」。'); }
$('invite').addEventListener('click', () => {
  const url = location.origin + location.pathname + '?room=' + net.code;
  (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(() => toast('已複製邀請連結', 1500)).catch(() => toast('房號 ' + net.code, 2500));

resize();
me.x = 420; me.y = 520;
requestAnimationFrame(frame);
})();
